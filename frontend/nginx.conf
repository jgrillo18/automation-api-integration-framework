server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # serve static files, fall back to index.html for routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # optional: handle favicon gracefully
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
