services:
  # ── Backend: FastAPI ──────────────────────────────────────────────────────
  - name: automation-api-backend
    type: web
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false             # set manually in Render dashboard → Neon PostgreSQL URL
      - key: SECRET_KEY
        sync: false             # set to a long random string in production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ENV
        value: production

  # ── Frontend: React (Vite → nginx) ───────────────────────────────────────
  - name: automation-api-frontend
    type: web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: automation-api-backend
          type: web
          property: hostURL      # Render injects full https://... URL of the backend
