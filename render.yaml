# render.yaml - referencia de configuracion
# NO requiere Blueprint (plan de pago). Usalo como guia al crear los servicios
# manualmente en Render. Ver README -> "Despliegue en Render" para los pasos.

services:
  # BACKEND: New -> Web Service -> conectar repo -> rootDir: backend
  - name: automation-api-backend
    type: web
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # pegar URL de Neon PostgreSQL (ej. postgresql://user:pass@host/db)
      - key: SECRET_KEY
        sync: false   # clave secreta aleatoria larga
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ENV
        value: production

  # FRONTEND: New -> Static Site -> conectar repo -> rootDir: frontend
  - name: automation-api-frontend
    type: web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # pegar la URL HTTPS del backend despues de crearlo
